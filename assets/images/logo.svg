  <circle cx="300" cy="92" r="10" fill="#1a1a1a" stroke="#c0c0c0" stroke-width="2"/>
  <!-- Text -->
  <text x="350" y="52" font-family="Arial Black, Impact, sans-serif" font-size="22" fill="#E63946" letter-spacing="1">CAR WORLDS</text>
  <text x="350" y="78" font-family="Arial, sans-serif" font-size="16" fill="#00D4FF" letter-spacing="2">BY RAJ</text>
